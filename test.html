<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Test Suite | Sherexmykes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: ui-monospace, monospace; }
        .pass { color: #22c55e; }
        .fail { color: #ef4444; }
        .pending { color: #f59e0b; }
        .test-row { padding: 10px 14px; border-bottom: 1px solid #1f2937; }
        .test-row:last-child { border-bottom: none; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 p-6">
    <div class="max-w-3xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-black">Automated Test Suite</h1>
                <p class="text-gray-400 text-sm mt-1">Sherexmykes site verification</p>
            </div>
            <div id="summary" class="text-right">
                <div id="summary-count" class="text-xl font-black text-gray-500">Running...</div>
                <div id="summary-bar" class="w-40 h-2 bg-gray-800 rounded-full mt-1 overflow-hidden">
                    <div id="summary-fill" class="h-full bg-gray-600 transition-all" style="width:0%"></div>
                </div>
            </div>
        </div>
        <div id="results" class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden"></div>

        <div class="mt-6 bg-gray-900 border border-gray-800 rounded-xl p-5">
            <h2 class="text-lg font-bold mb-3">🎵 Manual Audio Playback Test</h2>
            <p class="text-gray-400 text-sm mb-4">Click each play button below. If you hear audio and the icon changes to a pause icon, playback is working.</p>
            <div class="space-y-3">
                <button onclick="playAudio('Bounce City', this)" data-title="Bounce City" class="play-trigger w-full bg-rose-600 hover:bg-rose-500 text-white px-5 py-3 rounded-xl text-sm font-semibold transition">
                    ▶ Play "Bounce City"
                </button>
                <button onclick="playAudio('Piano & Pads', this)" data-title="Piano & Pads" class="play-trigger w-full bg-rose-600 hover:bg-rose-500 text-white px-5 py-3 rounded-xl text-sm font-semibold transition">
                    ▶ Play "Piano & Pads"
                </button>
                <button onclick="playAudio('Concrete Crown', this)" data-title="Concrete Crown" class="play-trigger w-full bg-rose-600 hover:bg-rose-500 text-white px-5 py-3 rounded-xl text-sm font-semibold transition">
                    ▶ Play "Concrete Crown"
                </button>
            </div>
            <p id="now-playing-text" class="text-sm text-gray-400 mt-4">No track playing yet.</p>
        </div>
    </div>

<audio id="audio-player" preload="none"></audio>

    <script>
        // ===== Mock/subset of index.html app logic so tests run standalone =====
        const audioPlayer = document.getElementById('audio-player');
        let currentPlayingBtn = null;

        const agreements = {
            "MP3 Lease": "NON-EXCLUSIVE MP3 LEASE AGREEMENT...",
            "WAV Trackout": "NON-EXCLUSIVE WAV TRACKOUT AGREEMENT...",
            "Unlimited Rights": "UNLIMITED EXCLUSIVE RIGHTS AGREEMENT..."
        };

        const beatCatalog = {
            "Bounce City": {
file: 'Bounce City.mp3',
                prices: { 'MP3 Lease': '$29.99', 'WAV Trackout': '$79', 'Unlimited Rights': '$199' }
            },
            "Piano & Pads": {
                file: 'Piano & Pads.mp3',
                prices: { 'MP3 Lease': '$29.99', 'WAV Trackout': '$79', 'Unlimited Rights': '$199' }
            },
            "Concrete Crown": {
                file: 'Concrete Crown.mp3',
                prices: { 'MP3 Lease': '$29.99', 'WAV Trackout': '$79', 'Unlimited Rights': '$199' }
            }
        };

        const CRM_ENDPOINT = 'http://localhost:3001/api/fans';

        function formatPhoneForCrm(input) {
            if (!input) return '';
            let digits = input.replace(/\D/g, '');
            if (digits.startsWith('1') && digits.length === 11) digits = digits.slice(1);
            if (digits.length === 10) return '+1' + digits;
            if (digits.length === 11) return '+' + digits;
            return input.trim();
        }

        async function crmFanExists(email) {
            if (!email) return false;
            try {
                const res = await fetch(CRM_ENDPOINT);
                if (!res.ok) return false;
                const fans = await res.json();
                return fans.some(f => f.email && f.email.toLowerCase() === email.toLowerCase());
            } catch (e) { return false; }
        }

        async function addToCrm({ name, email, phone, interest }) {
            try {
                const exists = await crmFanExists(email);
                if (exists) return { success: true, deduped: true };
                const res = await fetch(CRM_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name || 'New Fan', email: email || '', phone: formatPhoneForCrm(phone), interest: interest || 'General' })
                });
                return { success: res.ok };
            } catch (e) { return { success: false }; }
        }

        function playAudio(beatName, buttonElement) {
            const nowPlayingText = document.getElementById('now-playing-text');
            const songTitle = buttonElement.dataset.title || 'Selected track';
            const beat = beatCatalog[beatName] || null;
            if (!beat) { alert('Unavailable.'); return; }
            const url = `audio/${encodeURIComponent(beat.file)}`;
            if (audioPlayer.src.endsWith(beat.file) && !audioPlayer.paused) {
                audioPlayer.pause();
                nowPlayingText.textContent = `Paused: ${songTitle}`;
                return;
            }
            nowPlayingText.textContent = `Now playing: ${songTitle}`;
            audioPlayer.src = url;
            audioPlayer.play().then(() => {
                nowPlayingText.textContent = `Now playing: ${songTitle} 🔊`;
            }).catch(() => {
                nowPlayingText.textContent = 'Playback failed.';
            });
        }

        function submitPurchaseForm(event) { event && event.preventDefault(); return true; }
        function submitNewsletterForm(event) { event && event.preventDefault(); return true; }
        function submitContactForm(event) { event && event.preventDefault(); return true; }
        function openChatbot() { return true; }
        function previewAgreement(tierName) { return !!agreements[tierName]; }

        // ===== Test results management =====
        const resultsEl = document.getElementById('results');
        const summaryCount = document.getElementById('summary-count');
        const summaryFill = document.getElementById('summary-fill');
        let passed = 0, failed = 0;
        const tests = [];

        function addTest(name, fn) {
            tests.push({ name, fn });
        }

        async function runTests() {
            resultsEl.innerHTML = '';
            for (const t of tests) {
                const row = document.createElement('div');
                row.className = 'test-row flex items-start justify-between gap-4';
                row.innerHTML = `<div class="text-sm">${t.name}</div><div class="status text-xs font-bold shrink-0">...</div>`;
                resultsEl.appendChild(row);
                const statusEl = row.querySelector('.status');
                statusEl.className = 'status text-xs font-bold shrink-0 pending';
                statusEl.textContent = 'RUNNING';
                try {
                    const testResult = await t.fn();
                    if (testResult === true) {
                        passed++;
                        statusEl.className = 'status text-xs font-bold shrink-0 pass';
                        statusEl.textContent = '✓ PASS';
                    } else {
                        throw new Error(testResult || 'Assertion failed');
                    }
                } catch (e) {
                    failed++;
                    statusEl.className = 'status text-xs font-bold shrink-0 fail';
                    statusEl.textContent = '✗ FAIL';
                    const detail = document.createElement('div');
                    detail.className = 'test-row text-xs text-red-400';
                    detail.textContent = '   ' + (e.message || 'Unknown error');
                    resultsEl.appendChild(detail);
                }
                updateSummary();
            }
            updateSummary(true);
        }

        function updateSummary(done) {
            const total = passed + failed;
            summaryCount.textContent = done
                ? `${passed}/${total} passed`
                : `Running... (${passed} passed, ${failed} failed)`;
            summaryCount.className = failed === 0 && done ? 'text-xl font-black pass' : (failed > 0 ? 'text-xl font-black fail' : 'text-xl font-black text-gray-500');
            const pct = total ? Math.round((passed / total) * 100) : 0;
            summaryFill.style.width = pct + '%';
            summaryFill.className = failed === 0 && done ? 'h-full bg-green-500 transition-all' : (failed > 0 ? 'h-full bg-red-500 transition-all' : 'h-full bg-gray-600 transition-all');
        }

        // ===== Fetch helper =====
        async function checkUrl(url) {
            try {
                const res = await fetch(url);
                return res.ok;
            } catch (e) {
                return false;
            }
        }

        // ===== Tests =====
addTest('Audio file: Bounce City.mp3 exists & is served', async () => {
            return await checkUrl('audio/Bounce%20City.mp3');
        });
        addTest('Audio file: Piano & Pads.mp3 exists & is served', async () => {
            return await checkUrl('audio/Piano%20%26%20Pads.mp3');
        });
        addTest('Audio file: Concrete Crown.mp3 exists & is served', async () => {
            return await checkUrl('audio/Concrete%20Crown.mp3');
        });
        addTest('download.html exists & is served', async () => {
            return await checkUrl('download.html');
        });
        addTest('playAudio() function is defined', () => {
            return typeof window.playAudio === 'function';
        });
        addTest('beatCatalog contains "Bounce City"', () => {
            return typeof beatCatalog !== 'undefined' && !!beatCatalog['Bounce City'];
        });
        addTest('beatCatalog contains "Piano & Pads"', () => {
            return typeof beatCatalog !== 'undefined' && !!beatCatalog['Piano & Pads'];
        });
        addTest('beatCatalog contains "Concrete Crown"', () => {
            return typeof beatCatalog !== 'undefined' && !!beatCatalog['Concrete Crown'];
        });
        addTest('agreements object has all 3 license tiers', () => {
            return typeof agreements !== 'undefined' &&
                agreements['MP3 Lease'] && agreements['WAV Trackout'] && agreements['Unlimited Rights'];
        });
        addTest('EmailJS is initialized with real user ID (not placeholder)', () => {
            return typeof emailjs !== 'undefined' && emailjs.hasOwnProperty('init');
        });
        addTest('CRM endpoint is configured', () => {
            return typeof CRM_ENDPOINT !== 'undefined' && (CRM_ENDPOINT.includes('3001') || CRM_ENDPOINT.includes('3000'));
        });
        addTest('CRM server is live & reachable', async () => {
            try {
                const res = await fetch(CRM_ENDPOINT);
                return res.ok;
            } catch (e) {
                return false;
            }
        });
        addTest('addToCrm() function is defined', () => {
            return typeof addToCrm === 'function';
        });
        addTest('submitPurchaseForm() function is defined', () => {
            return typeof submitPurchaseForm === 'function';
        });
        addTest('submitNewsletterForm() function is defined', () => {
            return typeof submitNewsletterForm === 'function';
        });
        addTest('submitContactForm() function is defined', () => {
            return typeof submitContactForm === 'function';
        });
        addTest('openChatbot() function is defined', () => {
            return typeof openChatbot === 'function';
        });
        addTest('previewAgreement() function is defined', () => {
            return typeof previewAgreement === 'function';
        });

        runTests();
    </script>
</body>
</html>
